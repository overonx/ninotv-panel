<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NINOTV Panel</title>
  
  <!-- SDK Oficial de Telegram Mini Apps -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .search-box {
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .client-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .client-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-main);
    }

    .client-info {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-msg {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <span style="font-size: 1.4rem;">📺</span>
    <h1>NINOTV PANEL</h1>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Buscar cliente por nombre o usuario...">
  </div>

  <div id="statusCard" class="status-msg">
    ⚡ Escribe el nombre de un cliente para buscar
  </div>

  <div id="resultsContainer" class="results-container"></div>

  <script>
    // URL DE TU GOOGLE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4vh7RLYYmvcq6bCfG39Q0idElQeOkl45GaR_Uv5o-sYYzmjlvTJj2whsL7QzjazcS/exec";

    // Inicialización del SDK de Telegram
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
    }

    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('resultsContainer');
    const statusCard = document.getElementById('statusCard');

    let debounceTimer;

    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      const query = e.target.value.trim();

      if (query.length < 2) {
        resultsContainer.innerHTML = '';
        statusCard.style.display = 'block';
        statusCard.textContent = '⚡ Escribe al menos 2 letras para buscar';
        return;
      }

      statusCard.style.display = 'block';
      statusCard.textContent = '🔄 Buscando en la base de datos...';

      debounceTimer = setTimeout(() => {
        fetchData(query);
      }, 400);
    });

    async function fetchData(query) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=search&q=${encodeURIComponent(query)}`);
        const data = await response.json();

        resultsContainer.innerHTML = '';

        if (data.status === 'success' && data.results.length > 0) {
          statusCard.style.display = 'none';
          data.results.forEach(client => {
            const card = document.createElement('div');
            card.className = 'client-card';
            card.innerHTML = `
              <div class="client-name">👤 ${client.nombre || 'Sin nombre'}</div>
              <div class="client-info">🔑 Usuario: <strong>${client.usuario || 'N/A'}</strong></div>
              <div class="client-info">📅 Vence: ${client.vencimiento || 'N/A'}</div>
              <div class="client-info">📱 Servicio: ${client.servicio || 'N/A'}</div>
            `;
            resultsContainer.appendChild(card);
          });
        } else {
          statusCard.style.display = 'block';
          statusCard.textContent = '❌ No se encontraron clientes';
        }
      } catch (error) {
        statusCard.style.display = 'block';
        statusCard.textContent = '⚠️ Error de conexión con Google Sheets';
        console.error(error);
      }
    }
  </script>
</body>
</html>
